name: Node.js CI
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agenda
          POSTGRES_PASSWORD: agenda
          POSTGRES_USER: agenda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://agenda:agenda@127.0.0.1:5432/agenda
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run test:ci
  nest-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        nest-version: ['9.4.3', '10.4.20', '11.1.28']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Install NestJS ${{ matrix.nest-version }}
        run: >-
          bun add --no-save
          @nestjs/common@${{ matrix.nest-version }}
          @nestjs/core@${{ matrix.nest-version }}
          @nestjs/testing@${{ matrix.nest-version }}
      - run: bun run typecheck
      - run: bun run test:unit
      - run: bun run build
      - run: bun run test:package
